name: Build macOS installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: Intel
          - runner: macos-15
            arch: AppleSilicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source tree
        run: |
          test -f pyproject.toml
          test -f src/kitchen_curator/app.py
          test -f scripts/build-macos.sh
      - name: Build unsigned DMG
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Kitchen-Curator-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
